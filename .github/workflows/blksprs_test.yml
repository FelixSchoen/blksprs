name: BLK-SPRS Test

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: blksprs-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install ".[test]"

      - name: Lint source and tests
        run: python -m ruff check blksprs test

      - name: Type-check source
        run: python -m mypy

      - name: Compile source
        run: python -m compileall -q blksprs

  minimum-torch:
    name: Minimum PyTorch 2.8 compatibility
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install minimum PyTorch and collection dependencies
        run: python -m pip install "torch==2.8.*" pytest numpy matplotlib

      - name: Install BLK-SPRS without resolving a newer PyTorch
        run: python -m pip install --no-deps -e .

      - name: Verify declared minimum and collect tests
        env:
          BLKSPRS_AUTOTUNE: TEST
        run: |
          python - <<'PY'
          import torch
          import blksprs

          torch_version = torch.__version__.split("+", maxsplit=1)[0].split(".")
          assert torch_version[:2] == ["2", "8"], torch.__version__
          assert blksprs.ops.matmul
          assert "BlksprsTensor" in repr(blksprs.BlksprsTensor.wrap(torch.ones(1)))
          PY
          python -m pytest --collect-only -q test/cases

  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  package:
    name: Package on Python ${{ matrix.python-version }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: distributions
          path: dist

      - name: Install runtime dependency
        run: python -m pip install "torch>=2.8.0"

      - name: Test installed wheel outside the checkout
        env:
          BLKSPRS_AUTOTUNE: TEST
          TEST_ROOT: ${{ runner.temp }}
        run: |
          python -m pip install --no-deps dist/*.whl
          cd "$TEST_ROOT"
          python -c "from importlib.metadata import version; import blksprs; assert blksprs.__version__ == version('blksprs'); assert blksprs.ops.matmul"

      - name: Test installed source distribution outside the checkout
        env:
          BLKSPRS_AUTOTUNE: TEST
          TEST_ROOT: ${{ runner.temp }}
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.tar.gz
          cd "$TEST_ROOT"
          python -c "from importlib.metadata import version; import blksprs; assert blksprs.__version__ == version('blksprs'); assert blksprs.layouting.build_sparsity_layout"
