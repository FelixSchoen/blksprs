[pytest]
log_cli = 1
log_level = INFO
log_cli_format = %(asctime)s - [%(name)s] - %(levelname)s: %(message)s
pythonpath = ..
addopts = -m "not benchmark"
markers =
    benchmark: high-memory or high-runtime regression tests, deselected unless selected with -m benchmark
    cuda: tests that require a CUDA device, skipped without one
filterwarnings =
    always
